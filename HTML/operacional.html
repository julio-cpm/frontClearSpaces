<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operacional - SGC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../JS/common.js" defer></script>
    <script src="../JS/operacional.js" defer></script>
</head>
<body>
    <div class="app-container">
        <div class="page" id="operacional" style="display: block; opacity: 1; visibility: visible; position: relative;">
            <div class="header-operacional" style="position: relative;">
                <a class="btn-voltar" href="index.html" style="text-decoration: none; color: white;">‹</a>

                <button type="button" id="btn-notificacoes" onclick="toggleNotificacoes()"
                    style="position:absolute; top:15px; right:15px; background:rgba(255,255,255,0.15); border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; color:white;">
                    🔔
                    <span id="badge-notificacoes"
                        style="display:none; position:absolute; top:-2px; right:-2px; background:#e74c3c; color:white; font-size:11px; font-weight:700; border-radius:10px; min-width:18px; height:18px; line-height:18px; text-align:center; padding:0 4px;">0</span>
                </button>

                <div class="avatar"><div class="avatar-img"></div></div>
                <h2>Olá, Operador</h2>
                <p>Escala Ativa do Turno</p>

                <div id="painel-notificacoes"
                    style="display:none; position:absolute; top:60px; right:15px; width:280px; max-height:320px; overflow-y:auto; background:white; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:50; text-align:left;">
                    <div style="padding:12px 15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#333; font-size:14px;">Notificações</strong>
                        <span onclick="limparNotificacoesTela()" style="font-size:12px; color:#3498db; cursor:pointer;">Limpar</span>
                    </div>
                    <div id="lista-notificacoes-container"></div>
                </div>
            </div>

            <div class="page-content" style="max-width: 600px;">
                <div class="op-grid">
                    <a class="op-card blue" href="func-tarefas.html" style="text-decoration: none; display: flex;">
                        <i aria-hidden="true">📋</i>
                        <span>Minhas Tarefas</span>
                    </a>
                    <a class="op-card orange" href="func-ocorrencias.html" style="text-decoration: none; display: flex;">
                        <i aria-hidden="true">⚠️</i>
                        <span>Registrar Ocorrências</span>
                    </a>
                </div>
                <div style="margin-top: 10px;">
                    <a class="btn-danger" href="index.html" onclick="logout()" style="border-radius: 25px; text-decoration: none; display: block; text-align: center;">Sair do App</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
