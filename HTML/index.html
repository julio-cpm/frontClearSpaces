<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Space - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../JS/common.js" defer></script>
    <script src="../JS/login.js" defer></script>
</head>


<body>
    <div class="outer-panel">
        <div class="login-box">
            <div class="logo-box">
                <div class="logo-icon">✦</div>
                <div class="logo-text">
                    Clear <span>Spaces</span>
                </div>
            </div>
            <form onsubmit="fazerLogin(event)">
                <div class="input-group">
                    <label for="login-identificacao">CPF OU MATRÍCULA</label>
                    <input type="text" id="login-identificacao" placeholder="Login" required>
                </div>
                <div class="input-group">
                    <label for="login-senha">SENHA</label>
                    <input type="password" id="login-senha" placeholder="********" required>
                </div>
                <div class="forgot-password">
                    <a href="#" onclick="redefinirSenha(event)">ESQUECEU A SENHA?</a>
                </div>
                <button type="submit" class="btn-gestor">ENTRAR</button>
            </form>
        </div>
    </div>

    <div id="modal-redefinir" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>Redefinir Senha</h2>
            
            <div class="input-group">
                <label for="redefinir-identificacao">CPF OU MATRÍCULA</label>
                <input type="text" id="redefinir-identificacao" placeholder="Digite seu CPF ou Matrícula" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="redefinir-nova-senha">NOVA SENHA</label>
                <input type="password" id="redefinir-nova-senha" placeholder="Digite a nova senha">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalRedefinir()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="confirmarRedefinicaoSenha()">Confirmar</button>
            </div>
        </div>
    </div>
</body>

</html>
