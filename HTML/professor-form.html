<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Professor - SGC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../JS/common.js" defer></script>
    <script src="../JS/professor-form.js" defer></script>
</head>
<body>
    <div class="app-container">
        <div class="page" id="professor-form" style="display: flex; opacity: 1; visibility: visible; position: relative;">
            <div class="header">
                <a class="btn-voltar" href="professor-lista.html" style="text-decoration: none;">‹</a>
                <h1>Cadastrar Professor</h1>
            </div>

            <form class="page-content" onsubmit="event.preventDefault(); salvarProfessor();">
                <div class="input-group">
                    <label for="prof-nome">NOME COMPLETO</label>
                    <input type="text" id="prof-nome" placeholder="Digite o nome do professor" required>
                </div>

                <div class="input-group">
                    <label for="prof-cpf">CPF</label>
                    <input type="text" id="prof-cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label for="prof-senha">SENHA DE ACESSO</label>
                    <input type="password" id="prof-senha" placeholder="Digite uma senha" required>
                </div>

                <div class="input-group">
                    <label for="prof-periodo">PERÍODO</label>
                    <select id="prof-periodo" required>
                        <option value="1">Manhã</option>
                        <option value="2">Tarde</option>
                        <option value="3">Noite</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 15px;">
                    Salvar Professor no Banco
                </button>
            </form>
        </div>
    </div>
</body>
</html>
